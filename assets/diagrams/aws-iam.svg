<text class="t" x="454.0" y="130.0" text-anchor="middle">etc-full</text>
<text class="s" x="454.0" y="146.0" text-anchor="middle">CDN·Lambda·DNS</text>
<rect class="warn" x="514" y="112" width="108" height="44" rx="8"/>
<text class="t" x="568.0" y="130.0" text-anchor="middle">account-full</text>
<text class="s" x="568.0" y="146.0" text-anchor="middle">IAM</text>
<rect class="warn" x="628" y="112" width="108" height="44" rx="8"/>
<text class="t" x="682.0" y="130.0" text-anchor="middle">admin-full</text>
<text class="s" x="682.0" y="146.0" text-anchor="middle">전체 관리자</text>
<rect class="box" x="15" y="210" width="116" height="132" rx="8"/>
<text class="t" x="73.0" y="272.0" text-anchor="middle">신규 · 인턴</text>
<text class="s" x="73.0" y="288.0" text-anchor="middle">access-read</text>
