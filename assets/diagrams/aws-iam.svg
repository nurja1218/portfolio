<text class="t" x="321.0" y="248.0" text-anchor="middle">prod 개발자</text>
<text class="s" x="321.0" y="264.0" text-anchor="middle">access-read</text>
<text class="s" x="321.0" y="280.0" text-anchor="middle">prod-full</text>
<text class="s" x="321.0" y="296.0" text-anchor="middle">secret-read</text>
