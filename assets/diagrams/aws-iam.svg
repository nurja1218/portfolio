<text class="s" x="445.0" y="264.0" text-anchor="middle">access-read</text>
<text class="s" x="445.0" y="280.0" text-anchor="middle">dev · prod-full</text>
<text class="s" x="445.0" y="296.0" text-anchor="middle">secret-full</text>
<text class="s" x="445.0" y="312.0" text-anchor="middle">cicd · etc-full</text>
<rect class="warn" x="511" y="210" width="116" height="132" rx="8"/>
<text class="t" x="569.0" y="264.0" text-anchor="middle">팀장</text>
<text class="s" x="569.0" y="280.0" text-anchor="middle">매니저 그룹 전부</text>
<text class="s" x="569.0" y="296.0" text-anchor="middle">+ account-full</text>
<rect class="warn" x="635" y="210" width="116" height="132" rx="8"/>
<text class="t" x="693.0" y="272.0" text-anchor="middle">최상위 관리자</text>
<text class="s" x="693.0" y="288.0" text-anchor="middle">admin-full</text>
</svg>