<text class="t" x="197.0" y="256.0" text-anchor="middle">dev 개발자</text>
<text class="s" x="197.0" y="272.0" text-anchor="middle">access-read</text>
<text class="s" x="197.0" y="288.0" text-anchor="middle">dev-full</text>
<text class="s" x="197.0" y="304.0" text-anchor="middle">secret-read</text>
