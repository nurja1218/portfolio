<rect class="box" x="320" y="260" width="410" height="64" rx="8"/>
<text class="t" x="525.0" y="288.0" text-anchor="middle">Obsidian 화면 — 같은 파일을 사람이 본다</text>
<text class="s" x="525.0" y="304.0" text-anchor="middle">그래프 뷰 · 백링크 · 속성 패널 · 도메인 허브 Bases 표</text>
