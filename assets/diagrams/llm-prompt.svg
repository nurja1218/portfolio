<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="LLM 프롬프트 관리 체계 흐름">

<style>
  :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#8c959f; --box:#f6f8fa;
          --new:#e6f4ea; --newline:#2f855a; --warn:#fff4e5; --warnline:#b7791f; --group:#fbfbfc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#6e7681; --box:#161b22;
            --new:#12261b; --newline:#3fb950; --warn:#2a1f0d; --warnline:#d29922; --group:#10151c; }
  }
  .bg { fill: var(--bg); }
  .grp { fill: var(--group); stroke: var(--line); stroke-dasharray: 4 4; }
  .grpt { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .box { fill: var(--box); stroke: var(--line); }
  .new { fill: var(--new); stroke: var(--newline); }
  .warn { fill: var(--warn); stroke: var(--warnline); }
  .t { fill: var(--fg); font-size: 13px; }
  .s { fill: var(--muted); font-size: 11px; }
  .title { fill: var(--fg); font-size: 14px; font-weight: 700; }
  .e { stroke: var(--line); stroke-width: 1.4; fill: none; marker-end: url(#a); }
  .ed { stroke: var(--line); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
  .el { fill: var(--muted); font-size: 11px; }
  .ah { fill: var(--line); }
  text { font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
</style>

<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="760" height="300"/>
<path class="e" d="M170.0,72.9 L270.0,86.1"/>
<text class="el" x="220.0" y="67.5" text-anchor="middle">커밋 (서비스 무영향)</text>
<path class="e" d="M170.0,141.0 L270.0,121.0"/>
<text class="el" x="220.0" y="153.0" text-anchor="middle">통과 시 태그 승격</text>
<path class="ed" d="M375.0,130.0 L375.0,210.0"/>
<text class="el" x="427.0" y="164.0" text-anchor="middle">웹훅 · 주기 동기화</text>
<path class="e" d="M560.0,100.0 L480.0,100.0"/>
<text class="el" x="520.0" y="94.0" text-anchor="middle">1차 조회</text>
<path class="ed" d="M588.0,130.0 L422.6,210.0"/>
<text class="el" x="505.3" y="186.0" text-anchor="middle">2차 폴백</text>
<path class="e" d="M650.0,130.0 L650.0,210.0"/>
<rect class="box" x="20" y="40" width="150" height="46" rx="8"/>
<text class="t" x="95.0" y="59.0" text-anchor="middle">PO · 개발자</text>
<text class="s" x="95.0" y="75.0" text-anchor="middle">프롬프트 수정·커밋</text>
<rect class="warn" x="20" y="130" width="150" height="52" rx="8"/>
<text class="t" x="95.0" y="152.0" text-anchor="middle">평가 게이트</text>
<text class="s" x="95.0" y="168.0" text-anchor="middle">골든셋 자동 채점</text>
<rect class="new" x="270" y="70" width="210" height="60" rx="8"/>
<text class="t" x="375.0" y="96.0" text-anchor="middle">LangSmith (원본)</text>
<text class="s" x="375.0" y="112.0" text-anchor="middle">staging / production 태그</text>
<rect class="box" x="270" y="210" width="210" height="46" rx="8"/>
<text class="t" x="375.0" y="229.0" text-anchor="middle">DB 미러</text>
<text class="s" x="375.0" y="245.0" text-anchor="middle">장애 대비 폴백</text>
<rect class="box" x="560" y="70" width="180" height="60" rx="8"/>
<text class="t" x="650.0" y="88.0" text-anchor="middle">API · 워커</text>
<text class="s" x="650.0" y="104.0" text-anchor="middle">invoke(key, vars) 한 줄</text>
<text class="s" x="650.0" y="120.0" text-anchor="middle">60초 캐시</text>
<rect class="box" x="560" y="210" width="180" height="46" rx="8"/>
<text class="t" x="650.0" y="237.0" text-anchor="middle">LLM Provider</text>
</svg>