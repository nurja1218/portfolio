<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="지식그래프 기반 초개인화 쌓기와 꺼내기 흐름">

<style>
  :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#8c959f; --box:#f6f8fa;
          --new:#e6f4ea; --newline:#2f855a; --warn:#fff4e5; --warnline:#b7791f; --group:#fbfbfc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#6e7681; --box:#161b22;
            --new:#12261b; --newline:#3fb950; --warn:#2a1f0d; --warnline:#d29922; --group:#10151c; }
  }
  .bg { fill: var(--bg); }
  .grp { fill: var(--group); stroke: var(--line); stroke-dasharray: 4 4; }
  .grpt { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .box { fill: var(--box); stroke: var(--line); }
  .new { fill: var(--new); stroke: var(--newline); }
  .warn { fill: var(--warn); stroke: var(--warnline); }
  .t { fill: var(--fg); font-size: 13px; }
  .s { fill: var(--muted); font-size: 11px; }
  .title { fill: var(--fg); font-size: 14px; font-weight: 700; }
  .e { stroke: var(--line); stroke-width: 1.4; fill: none; marker-end: url(#a); }
  .ed { stroke: var(--line); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
  .el { fill: var(--muted); font-size: 11px; }
  .ah { fill: var(--line); }
  text { font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
</style>

<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="760" height="330"/>
<rect class="grp" x="175" y="20" width="330" height="150" rx="10"/>
<text class="grpt" x="187" y="38">백그라운드 잡 (응답을 막지 않음)</text>
<path class="e" d="M155.0,98.0 L190.0,98.0"/>
<path class="e" d="M330.0,98.0 L350.0,98.0"/>
<path class="e" d="M412.4,126.0 L389.5,210.0"/>
<text class="el" x="401.0" y="162.0" text-anchor="middle">저장</text>
<path class="e" d="M500.0,223.4 L560.0,212.6"/>
<text class="el" x="530.0" y="214.0" text-anchor="middle">꺼내기</text>
<path class="e" d="M500.0,258.7 L560.0,265.5"/>
<text class="el" x="530.0" y="276.1" text-anchor="middle">의미 검색</text>
<rect class="box" x="15" y="50" width="140" height="96" rx="8"/>
<text class="t" x="85.0" y="78.0" text-anchor="middle">사용자 활동</text>
<text class="s" x="85.0" y="94.0" text-anchor="middle">대화 요약 · 노트</text>
<text class="s" x="85.0" y="110.0" text-anchor="middle">AI 어시스턴트 대화</text>
<text class="s" x="85.0" y="126.0" text-anchor="middle">용어 교정</text>
<rect class="box" x="190" y="70" width="140" height="56" rx="8"/>
<text class="t" x="260.0" y="94.0" text-anchor="middle">① 추출 LLM</text>
<text class="s" x="260.0" y="110.0" text-anchor="middle">사용자 관련 사실</text>
<rect class="box" x="350" y="70" width="140" height="56" rx="8"/>
<text class="t" x="420.0" y="94.0" text-anchor="middle">② 판단 LLM</text>
<text class="s" x="420.0" y="110.0" text-anchor="middle">추가 / 갱신 / 유지</text>
<rect class="new" x="260" y="210" width="240" height="70" rx="8"/>
<text class="t" x="380.0" y="233.0" text-anchor="middle">사용자별 지식그래프</text>
<text class="s" x="380.0" y="249.0" text-anchor="middle">PostgreSQL + pgvector</text>
<text class="s" x="380.0" y="265.0" text-anchor="middle">노드·관계·임베딩 · 과거 값은 닫아서 보존</text>
<rect class="box" x="560" y="170" width="185" height="52" rx="8"/>
<text class="t" x="652.5" y="192.0" text-anchor="middle">번역 프롬프트</text>
<text class="s" x="652.5" y="208.0" text-anchor="middle">용어집(치환) + 배경지식(이해)</text>
<rect class="box" x="560" y="250" width="185" height="52" rx="8"/>
<text class="t" x="652.5" y="272.0" text-anchor="middle">AI 어시스턴트 답변</text>
<text class="s" x="652.5" y="288.0" text-anchor="middle">질문과 가까운 사실만</text>
</svg>