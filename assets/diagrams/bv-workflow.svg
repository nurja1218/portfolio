<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="작업 방식 — 명세 체인과 세션 인계">

<style>
  :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#8c959f; --box:#f6f8fa;
          --new:#e6f4ea; --newline:#2f855a; --warn:#fff4e5; --warnline:#b7791f; --group:#fbfbfc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#6e7681; --box:#161b22;
            --new:#12261b; --newline:#3fb950; --warn:#2a1f0d; --warnline:#d29922; --group:#10151c; }
  }
  .bg { fill: var(--bg); }
  .grp { fill: var(--group); stroke: var(--line); stroke-dasharray: 4 4; }
  .grpt { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .box { fill: var(--box); stroke: var(--line); }
  .new { fill: var(--new); stroke: var(--newline); }
  .warn { fill: var(--warn); stroke: var(--warnline); }
  .t { fill: var(--fg); font-size: 13px; }
  .s { fill: var(--muted); font-size: 11px; }
  .title { fill: var(--fg); font-size: 14px; font-weight: 700; }
  .e { stroke: var(--line); stroke-width: 1.4; fill: none; marker-end: url(#a); }
  .ed { stroke: var(--line); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
  .el { fill: var(--muted); font-size: 11px; }
  .ah { fill: var(--line); }
  text { font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
</style>

<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="760" height="330"/>
<text class="title" x="20" y="22">명세 체인 — 명세서도 vault 노드 (domain · moc · implements)</text>
<text class="title" x="20" y="190">세션 인계 — 인계서는 handoff/ 노드, 다음 인계가 superseded-by 로 잇는다</text>
<path class="e" d="M185.0,76.0 L200.0,76.0"/>
<path class="e" d="M370.0,76.0 L385.0,76.0"/>
<path class="e" d="M555.0,76.0 L570.0,76.0"/>
<path class="e" d="M255.0,260.0 L280.0,260.0"/>
<path class="e" d="M470.0,260.0 L495.0,260.0"/>
<rect class="new" x="15" y="38" width="170" height="76" rx="8"/>
<text class="t" x="100.0" y="56.0" text-anchor="middle">/spec-docs</text>
<text class="s" x="100.0" y="72.0" text-anchor="middle">코드 분석 → 명세서</text>
<text class="s" x="100.0" y="88.0" text-anchor="middle">Phase · 완료 기준 · 용어</text>
<text class="s" x="100.0" y="104.0" text-anchor="middle">구현은 안 한다</text>
<rect class="box" x="200" y="38" width="170" height="76" rx="8"/>
<text class="t" x="285.0" y="56.0" text-anchor="middle">/spec-review</text>
<text class="s" x="285.0" y="72.0" text-anchor="middle">다른 모델 교차 비판 2라운드</text>
<text class="s" x="285.0" y="88.0" text-anchor="middle">+ 보안 관점</text>
<text class="s" x="285.0" y="104.0" text-anchor="middle">외부 의견 먼저 → 차이만 합성</text>
<rect class="box" x="385" y="38" width="170" height="76" rx="8"/>
<text class="t" x="470.0" y="56.0" text-anchor="middle">/spec-run</text>
<text class="s" x="470.0" y="72.0" text-anchor="middle">Phase 별 실행</text>
<text class="s" x="470.0" y="88.0" text-anchor="middle">3파일+ = 격리된 워커</text>
<text class="s" x="470.0" y="104.0" text-anchor="middle">Phase 마다 결과 4항목</text>
<rect class="box" x="570" y="38" width="175" height="76" rx="8"/>
<text class="t" x="657.5" y="56.0" text-anchor="middle">/spec-verify</text>
<text class="s" x="657.5" y="72.0" text-anchor="middle">교차 비판 + 프로젝트 기준</text>
<text class="s" x="657.5" y="88.0" text-anchor="middle">수렴 게이트 · 라운드 상한 3</text>
<text class="s" x="657.5" y="104.0" text-anchor="middle">지적 판정을 명세에 기록</text>
<rect class="new" x="15" y="210" width="240" height="100" rx="8"/>
<text class="t" x="135.0" y="232.0" text-anchor="middle">/handoff-out (세션 끝)</text>
<text class="s" x="135.0" y="248.0" text-anchor="middle">① 산출물이 vault 에 기록됐는지 검색으로 감사</text>
<text class="s" x="135.0" y="264.0" text-anchor="middle">② 다시 볼 수 있는 것 = 명령 + 기대값</text>
<text class="s" x="135.0" y="280.0" text-anchor="middle">③ 다시 못 보는 것 = 결정 · 기각 · 실패 · 제약</text>
<text class="s" x="135.0" y="296.0" text-anchor="middle">④ 코드블럭 출력 + handoff/ 에 저장</text>
<rect class="warn" x="280" y="225" width="190" height="70" rx="8"/>
<text class="t" x="375.0" y="248.0" text-anchor="middle">인계 노트 136개</text>
<text class="s" x="375.0" y="264.0" text-anchor="middle">2026-08 ~ 11</text>
<text class="s" x="375.0" y="280.0" text-anchor="middle">이어 쓴 39개 = superseded-by</text>
<rect class="box" x="495" y="210" width="250" height="100" rx="8"/>
<text class="t" x="620.0" y="232.0" text-anchor="middle">/handoff-in (새 세션)</text>
<text class="s" x="620.0" y="248.0" text-anchor="middle">① 적힌 명령을 실제로 실행 — [시간] 태그부터</text>
<text class="s" x="620.0" y="264.0" text-anchor="middle">② 현재 상태는 실측 &gt; 인계서</text>
<text class="s" x="620.0" y="280.0" text-anchor="middle">③ 불일치를 근거와 함께 보고</text>
<text class="s" x="620.0" y="296.0" text-anchor="middle">④ 착수하지 않고 대기</text>
</svg>