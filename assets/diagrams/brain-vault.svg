<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Brain Vault 작업 체계 구조">

<style>
  :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#8c959f; --box:#f6f8fa;
          --new:#e6f4ea; --newline:#2f855a; --warn:#fff4e5; --warnline:#b7791f; --group:#fbfbfc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#6e7681; --box:#161b22;
            --new:#12261b; --newline:#3fb950; --warn:#2a1f0d; --warnline:#d29922; --group:#10151c; }
  }
  .bg { fill: var(--bg); }
  .grp { fill: var(--group); stroke: var(--line); stroke-dasharray: 4 4; }
  .grpt { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .box { fill: var(--box); stroke: var(--line); }
  .new { fill: var(--new); stroke: var(--newline); }
  .warn { fill: var(--warn); stroke: var(--warnline); }
  .t { fill: var(--fg); font-size: 13px; }
  .s { fill: var(--muted); font-size: 11px; }
  .title { fill: var(--fg); font-size: 14px; font-weight: 700; }
  .e { stroke: var(--line); stroke-width: 1.4; fill: none; marker-end: url(#a); }
  .ed { stroke: var(--line); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
  .el { fill: var(--muted); font-size: 11px; }
  .ah { fill: var(--line); }
  text { font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
</style>

<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="760" height="330"/>
<rect class="grp" x="300" y="15" width="445" height="300" rx="10"/>
<text class="grpt" x="312" y="33">Brain Vault (Obsidian · git 자동 백업)</text>
<path class="e" d="M235.0,85.5 L325.0,81.9"/>
<text class="el" x="280.0" y="75.7" text-anchor="middle">시작 시 규칙 로드</text>
<path class="e" d="M235.0,119.1 L325.0,142.9"/>
<text class="el" x="274.0" y="151.0" text-anchor="middle">작성 전 노트 검색</text>
<path class="ed" d="M125.0,120.0 L125.0,200.0"/>
<text class="el" x="171.0" y="164.0" text-anchor="middle">커밋할 때 실행</text>
<rect class="box" x="15" y="60" width="220" height="60" rx="8"/>
<text class="t" x="125.0" y="86.0" text-anchor="middle">Claude Code 세션</text>
<text class="s" x="125.0" y="102.0" text-anchor="middle">여러 기기 · 여러 계정</text>
<rect class="warn" x="15" y="200" width="220" height="60" rx="8"/>
<text class="t" x="125.0" y="226.0" text-anchor="middle">git 훅</text>
<text class="s" x="125.0" y="242.0" text-anchor="middle">AI 귀속 문구 차단 · 마커 검사</text>
<rect class="new" x="325" y="50" width="190" height="56" rx="8"/>
<text class="t" x="420.0" y="74.0" text-anchor="middle">claude-config/</text>
<text class="s" x="420.0" y="90.0" text-anchor="middle">규칙 · 훅 · 스킬 (~/.claude 링크)</text>
<rect class="new" x="535" y="50" width="190" height="56" rx="8"/>
<text class="t" x="630.0" y="74.0" text-anchor="middle">memory/</text>
<text class="s" x="630.0" y="90.0" text-anchor="middle">한 사실 한 파일 + 색인</text>
<rect class="box" x="325" y="140" width="190" height="56" rx="8"/>
<text class="t" x="420.0" y="164.0" text-anchor="middle">projects/&lt;레포&gt;/</text>
<text class="s" x="420.0" y="180.0" text-anchor="middle">명세 · 결정 · 장애 노트</text>
<rect class="box" x="535" y="140" width="190" height="56" rx="8"/>
<text class="t" x="630.0" y="164.0" text-anchor="middle">personal/career/</text>
<text class="s" x="630.0" y="180.0" text-anchor="middle">작업당 한 장 · 근거 첨부</text>
<rect class="box" x="325" y="230" width="400" height="56" rx="8"/>
<text class="t" x="525.0" y="254.0" text-anchor="middle">artifacts/</text>
<text class="s" x="525.0" y="270.0" text-anchor="middle">게시한 그림·설명서 사본 → 접근 제한 정적 사이트</text>
</svg>