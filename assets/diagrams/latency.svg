<rect class="new" x="245" y="300" width="190" height="52" rx="8"/>
<text class="t" x="340.0" y="322.0" text-anchor="middle">DynamoDB Global Table</text>
<text class="s" x="340.0" y="338.0" text-anchor="middle">세션·대화방·연결 ~5ms</text>
