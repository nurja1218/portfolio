<path class="e" d="M205.0,385.2 L245.0,386.3"/>
<path class="ed" d="M197.7,406.0 L267.3,428.0"/>
<path class="ed" d="M396.5,428.0 L573.5,356.0"/>
<text class="el" x="503.0" y="396.0" text-anchor="middle">PG 동기화</text>
